#asset-app .terminal-layouts{display:flex;gap:4px}.terminal-layouts button{display:grid;width:28px;height:28px;place-items:center;border:1px solid #35483f;border-radius:4px;background:#292929;color:#b6cbc1;font-size:15px}
#asset-app .terminal-layouts button:hover{border-color:#4fb98f;color:#fff}.terminal-sync{display:flex;align-items:center;gap:7px;font-size:11px;color:#a9bcb4}.terminal-sync input{width:14px;height:14px;padding:0;accent-color:#38a87e}
#asset-app .terminal-workspace-status{display:flex;gap:14px;margin-left:auto;color:#718a80;font-size:10px}
#asset-app .terminal-panes{display:grid;min-height:0;flex:1;gap:1px;background:#32443c}
#asset-app .terminal-panes.layout-single{grid-template-columns:1fr}.terminal-panes.layout-columns{grid-template-columns:repeat(var(--pane-count),minmax(0,1fr))}.terminal-panes.layout-rows{grid-template-rows:repeat(var(--pane-count),minmax(0,1fr))}.terminal-panes.layout-grid{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:minmax(0,1fr)}
#asset-app .terminal-pane{position:relative;display:grid;grid-template-rows:34px minmax(0,1fr);background:#000000;min-width:0;min-height:0;outline:1px solid transparent;outline-offset:-1px}
#asset-app .terminal-pane.active{outline-color:#369b76}.terminal-pane.dragging{outline:2px solid #5bd3a3;outline-offset:-2px}
#asset-app .terminal-pane header{display:flex;align-items:center;justify-content:space-between;padding:0 10px;background:#202020;border-bottom:1px solid #26372f;font-size:10px}
#asset-app .terminal-pane header>div{display:flex;align-items:center;gap:7px;min-width:0}.terminal-pane header strong{font-size:10px;color:#dbeae3}.terminal-pane header small{color:#718a80;font:10px ui-monospace,Consolas,monospace}
#asset-app .terminal-mode{border:1px solid #32463d;border-radius:3px;padding:2px 5px;color:#7d998d}.terminal-pane header button{display:grid;width:20px;height:20px;place-items:center;border:0;background:transparent;color:#8da69b;font-size:15px}.terminal-pane header button:hover{background:#2d3d36;color:#fff}
#asset-app .terminal-xterm{min-width:0;min-height:0;overflow:hidden;padding:8px 8px 6px;background:#000000}
#asset-app .terminal-xterm .xterm{height:100%}
#asset-app .terminal-xterm .xterm-viewport{background:#000000!important}
#asset-app .terminal-host-key{display:block;max-width:100%;overflow-wrap:anywhere;font-size:10px}
#asset-app .terminal-drop{position:absolute;inset:34px 0 0;display:none;place-content:center;text-align:center;background:rgba(13,26,21,.94);z-index:3;color:#b9d8ca;pointer-events:none}.terminal-pane.dragging .terminal-drop{display:grid}.terminal-drop strong{font-size:13px}.terminal-drop span{margin-top:6px;font-size:10px;color:#79988b}
/* 终端专属黑灰配色；绿色仅用于连接状态与 ANSI。 */
#asset-app .terminal-shell{background:#181818}
#asset-app .terminal-stage{color:#d0d0d0}
#asset-app .terminal-stage .terminal-panes[hidden]{display:none}
#asset-app .terminal-stage .terminal-panes{background:#383838}
#asset-app .terminal-stage .terminal-pane.active{outline-color:#888}
#asset-app .terminal-stage .terminal-pane.dragging{outline-color:#aaa}
#asset-app .terminal-stage .terminal-pane header{border-color:#383838}
#asset-app .terminal-stage .terminal-pane header strong,#asset-app .terminal-stage .terminal-empty h2{color:#ddd}
#asset-app .terminal-stage .terminal-empty,#asset-app .terminal-stage .terminal-empty-icon,#asset-app .terminal-stage small,#asset-app .terminal-stage .terminal-workspace-status,#asset-app .terminal-stage .terminal-mode{color:#999}
#asset-app .terminal-stage .terminal-session-tabs>button{color:#ccc}
#asset-app .terminal-stage .terminal-session-tabs>button[aria-selected="true"]{box-shadow:inset 0 2px #aaa;color:#fff}
#asset-app .terminal-stage .terminal-tools button,#asset-app .terminal-stage .terminal-layouts button,#asset-app .terminal-stage .terminal-mode,#asset-app .terminal-stage .terminal-empty>div span{border-color:#484848;color:#ccc}
#asset-app .terminal-stage button:hover{border-color:#888}
#asset-app .terminal-stage button:focus-visible{outline-color:#aaa}
#asset-app .terminal-stage .terminal-sync{color:#bbb}
#asset-app .terminal-stage .terminal-sync input{accent-color:#888}
#asset-app .terminal-stage .terminal-tab-close:hover,#asset-app .terminal-stage .terminal-pane header button:hover{background:#383838}
#asset-app .terminal-stage .terminal-pane header button{color:#bbb}
#asset-app .terminal-stage .terminal-drop{background:rgba(20,20,20,.94);color:#ddd}
#asset-app .terminal-stage .terminal-drop span{color:#aaa}
#asset-app .terminal-shell .terminal-host-icon{position:relative;background:#eee;color:#666}
#asset-app .terminal-shell .terminal-host-icon::after{content:'';position:absolute;right:-2px;bottom:-2px;width:8px;height:8px;border:2px solid var(--surface,#fff);border-radius:50%;background:#777}
#asset-app .terminal-shell [data-reachability="reachable"] .terminal-host-icon{background:#e0f4e8;color:#187343}
#asset-app .terminal-shell [data-reachability="reachable"] .terminal-host-icon::after{background:#187343}
#asset-app .terminal-shell [data-reachability="reachable"] .terminal-health{color:#187343}
#asset-app .terminal-shell [data-reachability="failed"] .terminal-host-icon{background:#fce6e6;color:#b42323}
#asset-app .terminal-shell [data-reachability="failed"] .terminal-host-icon::after{background:#b42323}
#asset-app .terminal-shell [data-reachability="failed"] .terminal-health{color:#b42323}
#asset-app .terminal-assets>.terminal-hint{padding:0 12px;font-size:11px;line-height:1.5}
#asset-app .terminal-shell .terminal-asset-diag{color:#777}
#asset-app .terminal-shell .terminal-add-asset,#asset-app .terminal-shell .terminal-group-switch button[aria-pressed="true"]{color:#666}
#asset-app .terminal-shell .terminal-add-asset:hover{background:#eee;border-color:#888}
#asset-app .terminal-footnote{display:flex;align-items:center;gap:8px;margin-top:10px;color:var(--sub);font-size:11px}.terminal-footnote .status-dot{flex:none}
#asset-app .terminal-auth-switch{display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:3px;background:var(--canvas);border:1px solid var(--line);border-radius:6px}
#asset-app .terminal-auth-switch button{border:0;background:transparent;padding:7px 6px;font-size:12px;color:var(--sub);border-radius:4px}
#asset-app .terminal-auth-switch button[aria-pressed="true"]{background:var(--surface);color:var(--accent-color);box-shadow:0 1px 3px rgba(16,36,31,.08);font-weight:600}
#asset-app .terminal-secret-row{display:grid;grid-template-columns:minmax(0,1fr) 58px;gap:6px;align-items:center}
#asset-app .terminal-secret-row input{margin:0}
#asset-app .terminal-reveal{height:34px;border:1px solid var(--line);border-radius:5px;background:var(--surface);color:var(--sub);font-size:11px}
#asset-app .terminal-reveal:hover{border-color:var(--accent-color);color:var(--accent-color)}
#asset-app .terminal-file-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
#asset-app .terminal-file-row input[type="file"]{max-width:100%;font-size:11px}
#asset-app .terminal-key-status{color:var(--sub);font-size:11px;overflow-wrap:anywhere}
#asset-app .terminal-key-status[data-state="ok"]{color:#1f8a63}
#asset-app .terminal-key-status[data-state="error"]{color:#c0392b}
#asset-app .terminal-hint{margin:6px 0 12px;color:var(--sub);font-size:11px;line-height:1.5}
#asset-app [data-auth-block="password"]{margin-top:4px}
#asset-app #terminal-asset-error,#asset-app #terminal-credential-error{min-height:18px;margin-top:10px;line-height:1.5}
#asset-app #terminal-asset-error[data-tone="info"],#asset-app #terminal-credential-error[data-tone="info"]{color:var(--accent-color)}
#asset-app .terminal-diag-meta{display:grid;grid-template-columns:104px minmax(0,1fr);gap:6px 12px;margin:12px 0 14px;font-size:12px}
#asset-app .terminal-diag-meta span{color:var(--sub)}
#asset-app .terminal-diag-meta strong{font-weight:600;overflow-wrap:anywhere}
#asset-app .terminal-diag-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
#asset-app .terminal-diag-step{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:7px;background:var(--canvas)}
#asset-app .terminal-diag-step.ok{border-color:#bfe3d2;background:#f2fbf7}
#asset-app .terminal-diag-step.fail{border-color:#f0c6bf;background:#fdf4f2}
#asset-app .terminal-diag-mark{display:grid;width:20px;height:20px;place-items:center;border-radius:50%;font-size:11px;font-weight:700;color:#fff;background:#25a67a}
#asset-app .terminal-diag-step.fail .terminal-diag-mark{background:#d9534f}
#asset-app .terminal-diag-step strong{display:block;font-size:12px;color:var(--ink)}
#asset-app .terminal-diag-step p{margin:4px 0 0;font-size:11px;line-height:1.55;color:var(--sub);overflow-wrap:anywhere}
#asset-app .terminal-diag-step .terminal-diag-hint{color:#9a6a12}
#asset-app .terminal-diag-key{margin-top:12px;padding:10px 12px;border:1px dashed var(--line);border-radius:7px;background:var(--canvas)}
#asset-app .terminal-diag-key span{display:block;font-size:11px;color:var(--sub);margin-bottom:6px}
#asset-app .terminal-diag-key code{display:block;font-size:10px;line-height:1.6;overflow-wrap:anywhere}
#asset-app .terminal-diag-actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:8px}
#asset-app .terminal-diag-actions button{border:1px solid var(--line);border-radius:5px;background:var(--surface);padding:5px 10px;font-size:11px;color:var(--accent-color)}
#asset-app .terminal-diag-actions button:hover{border-color:var(--accent-color)}
#asset-app .terminal-diag-actions span{font-size:10px;color:var(--sub);line-height:1.5;overflow-wrap:anywhere}
@media (max-width:900px){#asset-app .terminal-shell{grid-template-columns:210px minmax(520px,1fr);overflow:auto}.terminal-workspace-status span:last-child{display:none}}
@media (max-width:640px){#asset-app .terminal-shell{display:block;height:auto;min-height:0;overflow:visible}.terminal-assets{height:270px;border-right:0!important;border-bottom:1px solid var(--line)}.terminal-stage{height:620px}.terminal-panes.layout-columns,.terminal-panes.layout-grid{grid-template-columns:1fr!important;grid-auto-rows:minmax(0,1fr)}.terminal-workspace-status{display:none}.terminal-session-tabs>button{min-width:160px}}

/* 大文件传输抽屉：与终端会话解耦，切换标签或全屏都不影响任务 */
.transfer-drawer{position:fixed;top:0;right:0;bottom:0;width:min(400px,100vw);z-index:80;display:flex;flex-direction:column;background:#fff;border-left:1px solid #d7e0da;box-shadow:-12px 0 32px rgba(16,32,24,.14);font-size:13px;color:#1d2a24}
.transfer-drawer[hidden]{display:none}
.transfer-drawer>header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid #e6ece8}
.transfer-drawer>header h3{margin:0;font-size:15px}
.transfer-drawer>header button{border:0;background:transparent;font-size:20px;line-height:1;cursor:pointer;color:#5d6f66}
.transfer-body{flex:1;overflow:auto;padding:14px 16px 24px;display:flex;flex-direction:column;gap:12px}
.transfer-seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:3px;background:#f0f4f2;border-radius:8px}
.transfer-seg button{border:0;background:transparent;padding:7px 0;border-radius:6px;cursor:pointer;font-size:13px;color:#4a5a52}
.transfer-seg button[aria-selected="true"]{background:#fff;color:#0f3d2b;font-weight:600;box-shadow:0 1px 2px rgba(16,32,24,.12)}
.transfer-field{display:flex;flex-direction:column;gap:5px}
.transfer-field>span{font-size:12px;color:#5d6f66}
.transfer-field input,.transfer-field select{width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid #cfdad3;border-radius:6px;font:inherit;background:#fff}
.transfer-field input:focus,.transfer-field select:focus{outline:2px solid #55d2a1;outline-offset:1px;border-color:#55d2a1}
.transfer-check{display:flex;align-items:center;gap:7px;font-size:12px;color:#40514a}
.transfer-start{border:0;border-radius:7px;padding:10px;background:#12684a;color:#fff;font-weight:600;cursor:pointer}
.transfer-start:disabled{opacity:.6;cursor:progress}
.transfer-hint{margin:0;font-size:11.5px;line-height:1.55;color:#6b7c73}
.transfer-target-note{margin:-2px 0 2px;font-size:11.5px;line-height:1.55;color:#6b7c73}
.transfer-target-note[data-mismatch="true"]{margin:0;padding:8px 10px;border:1px solid #f0dcb4;border-radius:6px;background:#fff8e8;color:#a4681c}
.transfer-list-head{display:flex;align-items:center;justify-content:space-between;padding-top:6px;border-top:1px solid #e6ece8;font-size:12px;color:#5d6f66}
.transfer-list-head button{border:0;background:transparent;color:#12684a;cursor:pointer;font-size:12px}
.transfer-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.transfer-task{border:1px solid #e2e9e5;border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px;background:#fbfdfc}
.transfer-task[data-state="failed"]{border-color:#f0c9c9;background:#fff8f8}
.transfer-task[data-state="completed"]{border-color:#c8e8d8}
.transfer-task-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.transfer-task-head strong{font-size:12.5px;overflow-wrap:anywhere}
.transfer-task-head span{font-size:11px;color:#5d6f66;white-space:nowrap}
.transfer-bar{height:6px;border-radius:99px;background:#e8efeb;overflow:hidden}
.transfer-bar i{display:block;height:100%;background:linear-gradient(90deg,#12684a,#55d2a1);transition:width .2s ease}
.transfer-meta{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:#6b7c73}
.transfer-meta .mono{font-family:"Cascadia Mono",Consolas,monospace;overflow-wrap:anywhere;text-align:right}
.transfer-rate{color:#12684a;font-variant-numeric:tabular-nums}
.transfer-rate span:first-child{font-weight:600}
.transfer-error{margin:0;font-size:11.5px;color:#a12d2d;overflow-wrap:anywhere}
.transfer-task-actions{display:flex;gap:6px;justify-content:flex-end}
.transfer-task-actions button{border:1px solid #cfdad3;background:#fff;border-radius:6px;padding:4px 9px;font-size:11.5px;cursor:pointer;color:#2f443b}
.transfer-task-actions button:hover{border-color:#55d2a1;color:#0f3d2b}
.transfer-empty{margin:0;padding:18px 0;text-align:center;font-size:12px;color:#8a9a91}
@media (max-width:720px){.transfer-drawer{width:100vw}}

#asset-app.vab-shell{--canvas:#f6f8f9;--surface:#fff;--ink:#2c3e50;--sub:#909399;--line:#ebeef5;--accent-color:#4d8af0;--soft:#ecf5ff;--green:#67c23a;--amber:#e6a23c;--red:#f56c6c;--blue:#409eff;--purple:#8b5cf6;--sidebar:#191a23;--sidebar-width:240px;--admin-shadow:0 2px 12px 0 rgba(0,0,0,.08);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,Ubuntu,Cantarell,'Open Sans','Helvetica Neue',sans-serif;font-size:14px;line-height:1.5;min-height:100vh;width:100%;display:block;overflow:visible;border:0;border-radius:0;color-scheme:light;background:var(--canvas);color:var(--ink)}
#asset-app.vab-shell[data-theme=green]{--accent-color:#67c23a;--soft:#f0f9eb;--sidebar:#223b28;--blue:#58ad66}#asset-app.vab-shell[data-theme=gold]{--accent-color:#e6a23c;--soft:#fdf6ec;--sidebar:#3f3024;--blue:#dca244}
#asset-app.vab-shell .vab-icon{display:inline-block;width:1em;height:1em;min-width:1em;background-color:currentColor;-webkit-mask-image:var(--icon-image);mask-image:var(--icon-image);-webkit-mask-size:contain;mask-size:contain;-webkit-mask-position:center;mask-position:center;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;vertical-align:-.1em;flex-shrink:0}
#asset-app.vab-shell .op-icon{width:16px;height:16px;font-size:16px}#asset-app.vab-shell button{cursor:pointer}#asset-app.vab-shell button:disabled{cursor:not-allowed;opacity:.5}#asset-app.vab-shell input:focus-visible,#asset-app.vab-shell button:focus-visible,#asset-app.vab-shell select:focus-visible{outline:2px solid var(--accent-color);outline-offset:2px}
#asset-app.vab-shell .sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--sidebar-width);height:100vh;background:var(--sidebar);border:0;box-shadow:2px 0 8px #0002;padding:0;z-index:50;display:flex;flex-direction:column;overflow:hidden;transition:width .2s ease,transform .2s ease}
#asset-app.vab-shell .brand{height:70px;min-height:70px;width:100%;padding:0 28px;display:flex;align-items:center;gap:10px;background:var(--sidebar);border:0;border-radius:0;color:#fff;text-align:left;white-space:nowrap}
#asset-app.vab-shell .brand strong{font-size:22px;font-weight:650;letter-spacing:1px;color:#fff;display:block}#asset-app.vab-shell .vab-brand-icon{font-size:32px;width:34px;height:34px}
#asset-app.vab-shell #app-nav{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 7px 14px;scrollbar-width:thin;scrollbar-color:#ffffff24 transparent}
#asset-app.vab-shell .vab-nav-item,#asset-app.vab-shell .vab-nav-group-title{display:flex;align-items:center;gap:7px;min-height:50px;width:100%;padding:0 20px;margin:7px 0 0;border:0;border-radius:8px;background:transparent;color:rgba(255,255,255,.95);font-size:14px;font-weight:400;text-align:left;white-space:nowrap;position:relative}
#asset-app.vab-shell .vab-nav-item>.vab-icon,#asset-app.vab-shell .vab-nav-group-title>.vab-icon{font-size:13px}#asset-app.vab-shell .vab-nav-group-title>.vab-icon:last-child{margin-left:auto;font-size:10px;opacity:.65;transition:transform .2s}#asset-app.vab-shell .vab-nav-group.open>.vab-nav-group-title>.vab-icon:last-child{transform:rotate(180deg)}
#asset-app.vab-shell .vab-nav-item:hover,#asset-app.vab-shell .vab-nav-group-title:hover{background:#ffffff0c}#asset-app.vab-shell .vab-nav-item.active{background:linear-gradient(90deg,var(--accent-color),color-mix(in srgb,var(--accent-color) 76%,#fff));color:#fff;box-shadow:0 2px 6px color-mix(in srgb,var(--accent-color) 20%,transparent)}
#asset-app.vab-shell .vab-nav-children{padding:0 7px}#asset-app.vab-shell .vab-nav-children[hidden]{display:none}#asset-app.vab-shell .vab-nav-children .vab-nav-item{padding-left:38px;font-size:13px}#asset-app.vab-shell .vab-nav-children .vab-nav-item>.vab-icon{display:none}
#asset-app.vab-shell .vab-nav-item small{margin-left:auto;background:#f56c6c;border-radius:4px;line-height:18px;font-size:10px;padding:0 4px;color:#fff;font-weight:400}
#asset-app.vab-shell .vab-side-status{height:70px;flex:none;display:flex;align-items:center;gap:10px;padding:0 27px;font-size:12px;color:#d7d9df;border-top:1px solid #ffffff12}#asset-app.vab-shell .vab-side-status>span{width:7px;height:7px;border-radius:50%;background:#67c23a}#asset-app.vab-shell .vab-side-status small{display:block;font-size:11px;color:#9b9ca5;margin-top:3px}
#asset-app.vab-shell .app-main{margin-left:var(--sidebar-width);padding-top:114px;min-height:100vh;min-width:0;transition:margin-left .2s ease}#asset-app.vab-shell .vab-fixed-header{position:fixed;top:0;right:0;left:var(--sidebar-width);height:114px;z-index:40;background:#fff;box-shadow:var(--admin-shadow);transition:left .2s ease}
#asset-app.vab-shell .topbar{height:60px;padding:0 22px;border-bottom:1px solid #f1f2f3;display:flex;align-items:center;justify-content:space-between;gap:16px;background:#fff}
#asset-app.vab-shell .vab-top-left{display:flex;align-items:center;gap:14px;min-width:0}#asset-app.vab-shell .breadcrumb{display:flex;align-items:center;gap:12px;font-size:14px;white-space:nowrap;color:#606266;min-width:0}#asset-app.vab-shell .breadcrumb>span{padding:0;display:flex;align-items:center;gap:12px;color:#909399}#asset-app.vab-shell .breadcrumb .vab-icon{font-size:9px;color:#b8bac0}#asset-app.vab-shell .breadcrumb strong{font-weight:400;color:#606266}
#asset-app.vab-shell .top-actions{display:flex;align-items:center;gap:12px}#asset-app.vab-shell .vab-circle-button{width:34px;height:34px;min-width:34px;display:inline-flex;align-items:center;justify-content:center;border:1px solid #f0f1f2;border-radius:50%;background:#fff;color:#606266;box-shadow:0 1px 3px #00000003;padding:0;font-size:14px}#asset-app.vab-shell .vab-circle-button:hover{color:var(--accent-color);background:var(--soft)}
#asset-app.vab-shell .global-search{display:flex;align-items:center;gap:7px;color:#909399;padding:0 8px}#asset-app.vab-shell .global-search input{font-size:12px;width:145px;border:0;background:transparent;padding:5px 0;min-height:28px;line-height:18px;box-shadow:none}#asset-app.vab-shell .global-search>.vab-icon{font-size:14px}
#asset-app.vab-shell .vab-avatar-button{padding:0;border:0;background:transparent;display:grid;place-items:center;width:40px;height:40px}#asset-app.vab-shell .vab-avatar{background-image:var(--vab-avatar-image);background-size:cover;background-position:center;width:38px;height:38px;display:inline-block;border-radius:50%;box-shadow:0 2px 10px #0001;flex-shrink:0}
#asset-app.vab-shell .vab-tagsbar{height:54px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;gap:18px;position:relative;background:rgba(255,255,255,.8)}
#asset-app.vab-shell .vab-page-tabs{display:flex;align-items:center;gap:8px;min-width:0;overflow-x:auto;scrollbar-width:none;padding:7px 0;flex:1}#asset-app.vab-shell .vab-page-tab{display:flex;align-items:center;background:#f5f5f5;color:#606266;border-radius:8px;flex:none;height:32px;box-shadow:0 1px 4px #00000003}
#asset-app.vab-shell .vab-page-tab>button{border:0;background:transparent;font-size:13px;color:inherit;display:flex;align-items:center;gap:7px;padding:7px 16px;line-height:18px;white-space:nowrap;border-radius:8px;height:32px}#asset-app.vab-shell .vab-page-tab.active{background:linear-gradient(90deg,var(--accent-color),color-mix(in srgb,var(--accent-color) 74%,white));color:#fff;box-shadow:0 3px 8px color-mix(in srgb,var(--accent-color) 24%,transparent)}

  async function saveAssetEdit(button) {

  function syncAssets() {
    const api = window.QiyunAPI;
    const status = api?.assetStatus?.() || { loaded: true };
    const remote = (api?.getAssets?.() || []).map(ledgerRow);
    const local = assets.filter(a => a.source === 'local');
    // 清单还没读到（或读失败）时不要用空数组覆盖已有台账，否则界面会误报“资产消失”。
    if (!status.loaded && remote.length === 0 && assets.some(a => a.source === 'api')) return;
    // Mutate in place: other modules hold a reference to this array.
    assets.length = 0;
    assets.push(...local, ...remote);
    if (state.page === 'assets' || state.page === 'overview') { try { render(); } catch { /* before first paint */ } }
  }

(function () {
  'use strict';
  // 主机指标客户端：只负责取数、轮询与广播，渲染留给 infra.js。
  // 服务端每 60 秒通过 SSH 采样一次；这里拿到的是最近一次结果加上历史曲线。
  const state = {
    items: new Map(), interval: 60, fetchedAt: 0, timer: 0,
    loading: false, error: null, listeners: new Set()
  };

  function api() { return window.QiyunAPI; }
  function emit() {
    state.listeners.forEach(fn => { try { fn(state); } catch (e) { console.warn('host metrics listener failed', e); } });
  }
  function put(item) {
    if (!item || !item.asset_id) return;
    state.items.set(item.asset_id, item);
  }

  async function refresh() {
    if (state.loading || !api()?.request) return state.items;
    state.loading = true;
    try {
      const data = await api().request('/api/v1/metrics');
      const next = new Map();
      (data.items || []).forEach(item => next.set(item.asset_id, item));
      state.items = next;
      state.interval = data.interval_seconds || 0;
      state.fetchedAt = Date.now();
      state.error = null;
    } catch (error) {
      state.error = error;
    } finally {
      state.loading = false;
      emit();
    }
    return state.items;
  }

  async function collect(assetId) {
    if (!api()?.request) throw new Error('服务未就绪');
    const item = await api().request('/api/v1/metrics/' + encodeURIComponent(assetId) + '/collect', { method: 'POST', body: '{}' });
    put(item);
    emit();
    return item;
  }

  async function history(assetId, limit = 60) {
    const data = await api().request('/api/v1/metrics/' + encodeURIComponent(assetId) + '/history?limit=' + limit);
    return data.samples || [];
  }

  function get(assetId) { return state.items.get(assetId) || null; }

  function summary() {
    const items = Array.from(state.items.values());
    return {
      total: items.length,
      ok: items.filter(item => item.status === 'ok').length,
      failed: items.filter(item => item.status === 'error').length,
      pending: items.filter(item => item.status === 'pending').length,
      interval: state.interval,
      fetchedAt: state.fetchedAt,
      error: state.error
    };
  }

  function start() {
    stop();
    const seconds = Math.max(30, state.interval || 60);
    state.timer = setInterval(() => {
      // 后台标签页不轮询，避免无意义的 SSH 采样。
      if (!document.hidden) refresh();
    }, seconds * 1000);
  }
  function stop() {
    if (state.timer) clearInterval(state.timer);
    state.timer = 0;
  }
  function on(fn) { state.listeners.add(fn); return () => state.listeners.delete(fn); }

  window.HostMetrics = { refresh, collect, history, get, summary, on, start, stop };
  refresh().then(start).catch(() => {});
})();

    if (!usable.length) return '<option value="">暂无已核验指纹的主机</option>';
    return usable.map(item => `<option value="${item.id}" ${item.id === selectedId ? 'selected' : ''}>${(item.name || item.address)} · ${item.address}</option>`).join('');
  }

  function taskRow(task) {
    const live = progress.get(task.id);
    const sent = live?.offset ?? task.offset;
    const percent = task.size > 0 ? Math.min(100, Math.round((sent / task.size) * 100)) : (task.status === 'completed' ? 100 : 0);
    const running = !!live;
    const direction = task.direction === 'upload' ? '上传' : '下载';
    const detail = task.error ? `<p class="transfer-error">${escapeHtml(task.error)}</p>` : '';
    // While an upload runs the bytes live in a staging file; without saying so,
    // checking the remote directory looks like the upload went nowhere.
    const staging = task.direction === 'upload' && task.status !== 'completed' && task.temp_path
      ? `<div class="transfer-meta"><span>远端临时文件</span><span class="mono">${escapeHtml(task.temp_path)}</span></div>`
      : '';
    const actions = running
      ? `<button type="button" data-op="cancel" data-id="${task.id}">停止</button>`
      : `${task.status === 'completed' || task.status === 'failed' ? `<button type="button" data-op="remove" data-id="${task.id}">移除</button>` : ''}${task.status === 'paused' || task.status === 'active' || task.status === 'pending' ? `<button type="button" data-op="cancel" data-id="${task.id}">取消</button>` : ''}${task.direction === 'download' && task.status !== 'completed' ? `<button type="button" data-op="resume-download" data-id="${task.id}">继续下载</button>` : ''}`;
    const hostLine = task.asset_id ? `<div class="transfer-meta"><span>目标主机</span><span>${escapeHtml(assetLabel(task.asset_id))}</span></div>` : '';
    return `<li class="transfer-task" data-state="${task.status}">
      <div class="transfer-task-head"><strong>${direction} ${escapeHtml(task.file_name)}</strong><span>${statusLabel(task)}</span></div>
      ${hostLine}
      <div class="transfer-bar" role="progressbar" aria-valuenow="${percent}" aria-valuemin="0" aria-valuemax="100"><i style="width:${percent}%"></i></div>
      <div class="transfer-meta"><span>${fmtBytes(sent)} / ${fmtBytes(task.size)} · ${percent}%</span><span class="mono">${escapeHtml(task.remote_path)}</span></div>
      ${live && live.rate ? `<div class="transfer-meta transfer-rate"><span>${fmtBytes(live.rate)}/s</span><span>${live.eta ? '剩余 ' + fmtEta(live.eta) : ''}</span></div>` : ''}
      ${staging}
      ${detail}
      <div class="transfer-task-actions">${actions}</div>
    </li>`;
  }

  function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  }

  function build() {
    drawer = el(`<aside class="transfer-drawer" hidden aria-label="文件传输">
      <header><h3>文件传输</h3><button type="button" data-op="close" aria-label="关闭">×</button></header>
      <div class="transfer-body">
        <div class="transfer-seg" role="tablist">
          <button type="button" role="tab" data-op="mode" data-mode="upload" aria-selected="true">上传</button>
          <button type="button" role="tab" data-op="mode" data-mode="download" aria-selected="false">下载</button>
        </div>
        <label class="transfer-field"><span>目标主机</span><select data-field="asset"></select></label>
        <p class="transfer-target-note" data-target-note></p>
        <label class="transfer-field"><span>远端路径</span><input data-field="path" placeholder="/tmp/example.bin" spellcheck="false"></label>
        <div class="transfer-upload-only">
          <label class="transfer-field"><span>本地文件</span><input type="file" data-field="file"></label>
          <label class="transfer-check"><input type="checkbox" data-field="overwrite"><span>允许覆盖远端同名文件</span></label>
        </div>
        <button type="button" class="transfer-start" data-op="start">开始上传</button>
        <p class="transfer-hint" data-hint></p>
        <div class="transfer-list-head"><span>任务</span><button type="button" data-op="refresh">刷新</button></div>
        <ul class="transfer-list" data-list></ul>
      </div>
    </aside>`);
    document.body.appendChild(drawer);
    drawer.addEventListener('click', onClick);
    drawer.addEventListener('change', onChange);
    syncDrawerPlacement();
  }

  // A drawer inside <body> is invisible while the terminal stage is fullscreen,
  // so it follows the current fullscreen element instead of exiting fullscreen.
  function syncDrawerPlacement() {
    if (!drawer) return;
    const host = document.fullscreenElement && document.querySelector('.terminal-stage') === document.fullscreenElement
      ? document.fullscreenElement
      : document.body;
    if (drawer.parentElement !== host) host.appendChild(drawer);
  }
  document.addEventListener('fullscreenchange', syncDrawerPlacement);

  function query(selector) { return drawer?.querySelector(selector); }

  // 抽屉以前不认当前终端，默认选中资产列表第一台：在 A 机终端里点“文件传输”，
  // 实际发往了 B 机，报的却是“主机不可达”，看上去像 SSH 明明通了却不给传。
  function activeHostId() {
    const snap = A.terminalWorkspace?.snapshot?.();
    if (!snap) return '';
    const tabs = snap.tabs || [];
    const tab = tabs.find(item => item.id === snap.activeTabId) || tabs[0];
    if (!tab) return '';
    const pane = snap.panes?.[tab.activePaneId] || snap.panes?.[tab.paneIds?.[0]];
    return pane?.hostId || tab.hostId || '';
  }
  let pinnedHost = '';

  function assetLabel(id) {
    const asset = assets.find(item => item.id === id);
    if (!asset) return id;
    return (asset.name || asset.address) + ' · ' + asset.address + (asset.ssh_port && asset.ssh_port !== 22 ? ':' + asset.ssh_port : '');
  }

  function render() {
    if (!drawer) return;
    const assetSelect = query('[data-field="asset"]');
    const keep = pinnedHost || assetSelect.value;
    assetSelect.innerHTML = hostOptions(keep);
    const chose = assetSelect.value;
    const connected = activeHostId();
    const note = query('[data-target-note]');
    if (note) {
      note.textContent = !connected ? ''
        : chose === connected ? `与终端一致：${assetLabel(connected)}`
        : `注意：当前终端连接的是 ${assetLabel(connected)}，这里的操作会发往 ${chose ? assetLabel(chose) : '所选主机'}。`;
      note.dataset.mismatch = String(!!connected && chose !== connected);
    }
    query('.transfer-upload-only').hidden = mode !== 'upload';
    query('[data-op="start"]').textContent = mode === 'upload' ? '开始上传' : '开始下载';
    drawer.querySelectorAll('[data-op="mode"]').forEach(button => button.setAttribute('aria-selected', String(button.dataset.mode === mode)));
    query('[data-hint]').textContent = mode === 'upload'
      ? `分块上传，单块 ${fmtBytes(CHUNK)}，失败自动重试，实时速率与剩余时间见任务行。远端只出现 .part 临时文件，全部完成才改名为目标文件；中断后重新选择同一文件即可续传。速率长时间稳定在同一条水平线上，通常是链路带宽上限，不是程序在丢包。`
      : '下载使用浏览器流式写盘；不支持流式写入的浏览器会改为浏览器直接下载，且不记录断点。';
    query('[data-list]').innerHTML = tasks.length
      ? tasks.map(taskRow).join('')
      : '<li class="transfer-empty">暂无传输任务</li>';
  }

  // 任务列表来自服务端，刚建好的任务还没有行。不补进去的话，进度条要等整段
  // 传输结束才出现，看上去就像点完之后什么都没发生。
  function trackTask(task) {
    if (!task || !task.id) return;
    const index = tasks.findIndex(item => item.id === task.id);
    if (index >= 0) tasks[index] = { ...tasks[index], ...task };
    else tasks = [task, ...tasks];
  }

  async function refreshTasks() {
    try {
      const data = await api('/api/v1/transfers');
      tasks = data.items || [];
      render();
    } catch (error) {
      query('[data-list]') && (query('[data-list]').innerHTML = `<li class="transfer-empty">读取任务失败：${escapeHtml(error.message)}</li>`);
    }
  }

  async function open(hostId) {
    if (!drawer) build();
    drawer.hidden = false;
    syncDrawerPlacement();
    pinnedHost = hostId || activeHostId() || '';
    try {
      const data = await api('/api/v1/assets');
      assets = data.items || [];
    } catch (error) {
      A.toast?.('读取资产失败：' + error.message);
    }
    render();
    pinnedHost = '';
    await refreshTasks();
  }

  function close() { if (drawer) drawer.hidden = true; }

  A.actions['terminal-transfer'] = () => open(activeHostId());
  A.transferPanel = { open, close, refresh: refreshTasks };

  function onClick(event) {
    const button = event.target.closest('[data-op]');
    if (!button) return;
    const op = button.dataset.op;
    if (op === 'close') return close();
    if (op === 'mode') { mode = button.dataset.mode; return render(); }
    if (op === 'refresh') return refreshTasks();
    if (op === 'start') return mode === 'upload' ? startUpload() : startDownload();
    if (op === 'cancel') return cancelTask(button.dataset.id);
    if (op === 'remove') return removeTask(button.dataset.id);
    if (op === 'resume-download') return resumeDownloadById(button.dataset.id);
  }

  function onChange(event) {
    if (event.target.dataset.field === 'file' && event.target.files?.[0]) {
      // Prefill the remote path with the chosen file name so the common case
      // needs only one edit (the directory).
      const pathInput = query('[data-field="path"]');
      if (!pathInput.value.trim()) pathInput.value = '/tmp/' + event.target.files[0].name;
    }
  }

  async function cancelTask(id) {
    try {
      canceledTasks.add(id);
      if (activeDownload?.taskId === id) activeDownload.abort = true;
      await api(`/api/v1/transfers/${id}`, { method: 'DELETE' });
      progress.delete(id);
      await refreshTasks();
    } catch (error) { A.toast?.('取消失败：' + error.message); }
  }

  async function removeTask(id) {
    try {
      await api(`/api/v1/transfers/${id}`, { method: 'DELETE' });
      await refreshTasks();
    } catch (error) { A.toast?.('移除失败：' + error.message); }
  }

  function selectedAsset() {
    const id = query('[data-field="asset"]').value;
    if (!id) { A.toast?.('请先选择一台已核验指纹的主机。'); return null; }
    return id;
  }

  async function startUpload() {
    if (busy) return A.toast?.('已有上传正在进行。');
    const assetId = selectedAsset(); if (!assetId) return;
    const remotePath = query('[data-field="path"]').value.trim();
    const file = query('[data-field="file"]').files?.[0];
    if (!file) return A.toast?.('请选择要上传的本地文件。');
    if (!remotePath.startsWith('/') || remotePath.endsWith('/') || remotePath.split('/').includes('..')) {
      return A.toast?.('远端路径必须是绝对的文件路径，且不能包含 ..');
    }
    busy = true;
    query('[data-op="start"]').disabled = true;
    try {
      const existing = (await api('/api/v1/transfers?asset_id=' + encodeURIComponent(assetId))).items || [];
      // 失败的任务同样可以续传：服务端只在 offset 处接续，且会把临时文件回退到
      // 该偏移。之前把 failed 排除在外，于是提示说「可续传」却只能从头再来。
      let task = existing.find(item => item.direction === 'upload' && item.remote_path === remotePath && item.size === file.size
        && !['completed', 'canceled'].includes(item.status));
      if (!task) {
        task = await api('/api/v1/transfers', {
          method: 'POST',
          body: JSON.stringify({
            asset_id: assetId, direction: 'upload', remote_path: remotePath,
            file_name: file.name, size: file.size, overwrite: query('[data-field="overwrite"]').checked,
          }),
        });
      }
      let offset = task.offset || 0;
      if (offset > 0 && offset < task.size) {
        A.toast?.(`从 ${fmtBytes(offset)} 处继续上传。`);
      }
      noteProgress(task.id, offset, task.size);
      trackTask(task);
      activeTaskId = task.id;
      const startedAt = Date.now();
      render();
      // The next slice is read while the current one is in flight, so the file
      // read and the request never wait on each other. Ordering is unchanged:
      // exactly one chunk is outstanding and the server still owns the offset.
      let pending = offset < task.size ? sliceChunk(file, offset, task.size) : null;
      while (offset < task.size) {
        if (canceledTasks.has(task.id)) throw new Error('已取消');
        const buffer = await pending;
        const from = offset;
        const following = Math.min(from + CHUNK, task.size);
        pending = following < task.size ? sliceChunk(file, following, task.size) : null;
        const result = await sendChunk(task.id, buffer, from);
        if (result.resync !== undefined) {
          // The server confirmed a different offset (e.g. a chunk landed while a
          // response was lost); trust the server and re-slice from there.
          offset = result.resync;
          pending = offset < task.size ? sliceChunk(file, offset, task.size) : null;
        } else {
          offset = result.offset;
        }
        noteProgress(task.id, offset, task.size);
        render();
      }
      const elapsed = (Date.now() - startedAt) / 1000;
      // A transfer whose bytes all landed but whose publish failed comes back
      // with offset == size and never enters the loop above, so ask the server to
      // publish once more. This call is idempotent for an already-finished task.
      await api(`/api/v1/transfers/${task.id}/complete`, { method: 'POST' });
      progress.delete(task.id);
      await refreshTasks();
      const avg = elapsed > 0.5 ? ` · 平均 ${fmtBytes(task.size / elapsed)}/s` : '';
      A.toast?.(`上传完成：${remotePath}${avg}`);
    } catch (error) {
      progress.delete(activeTaskId);
      await refreshTasks().catch(() => {});
      A.toast?.('上传中断：' + error.message + '（任务已保留：重新选择同一文件再点开始，会从断点继续）');
    } finally {
      busy = false;
      query('[data-op="start"]').disabled = false;
    }
  }

  const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

  function sliceChunk(file, offset, total) {
    return file.slice(offset, Math.min(offset + CHUNK, total)).arrayBuffer();
  }

  // A single lost chunk should not abort a long upload: the server already
  // reconnects once, and this retries the request a couple more times before
  // surfacing the error. Offset mismatches resync instead of failing.
  async function sendChunk(taskId, buffer, offset) {
    let lastError = null;
    for (let attempt = 0; attempt < 3; attempt += 1) {
      if (canceledTasks.has(taskId)) throw new Error('已取消');
      try {
        const response = await fetch(`/api/v1/transfers/${taskId}/chunk?offset=${offset}`, {
          method: 'PUT',
          headers: auth({ 'Content-Type': 'application/octet-stream' }),
          body: buffer,
        });
        const body = await response.json().catch(() => null);
        if (response.ok) return { offset: body.offset };
        if (response.status === 409 && body?.code === 'OFFSET_MISMATCH') {
          const fresh = await api(`/api/v1/transfers/${taskId}`);
          return { resync: fresh.offset };
        }
        // 4xx other than a resync will not succeed on retry.
        if (response.status < 500 && response.status !== 429) throw new Error(body?.detail || `HTTP ${response.status}`);
        lastError = new Error(body?.detail || `HTTP ${response.status}`);
      } catch (error) {
        if (error.status && error.status >= 400 && error.status < 500) throw error;
        lastError = error;
      }
      await sleep(500 * (attempt + 1));
    }
    throw lastError || new Error('分块上传失败');
  }

  let activeTaskId = '';
  let activeDownload = null;

  async function startDownload() {
    if (busy) return A.toast?.('已有传输正在进行。');
    const assetId = selectedAsset(); if (!assetId) return;
    const remotePath = query('[data-field="path"]').value.trim();
    if (!remotePath.startsWith('/') || remotePath.endsWith('/')) return A.toast?.('远端路径必须是绝对的文件路径。');
    busy = true;
    query('[data-op="start"]').disabled = true;
    try {
      const task = await api('/api/v1/transfers', {
        method: 'POST',
        body: JSON.stringify({ asset_id: assetId, direction: 'download', remote_path: remotePath }),
      });
      await streamDownload(task);
    } catch (error) {
      A.toast?.('下载失败：' + error.message);
      await refreshTasks().catch(() => {});
    } finally {
      busy = false;
      query('[data-op="start"]').disabled = false;
    }
  }

  async function resumeDownloadById(id) {
    if (busy) return A.toast?.('已有传输正在进行。');
    try {
      const task = await api(`/api/v1/transfers/${id}`);
      busy = true;
      await streamDownload(task);
    } catch (error) {
      A.toast?.('继续下载失败：' + error.message);
    } finally {
      busy = false;
    }
  }

  async function streamDownload(task) {
    activeTaskId = task.id;
    trackTask(task);
    const start = task.offset || 0;
    if (!window.showSaveFilePicker) {
      // Without the File System Access API a large download cannot be streamed
      // to disk with a recorded offset, so hand it to the browser directly
      // instead of buffering it in memory.
      const url = `/api/v1/transfers/${task.id}/content${token() ? '?access_token=' + encodeURIComponent(token()) : ''}`;
      const link = document.createElement('a');
      link.href = url; link.download = task.file_name;
      document.body.appendChild(link); link.click(); link.remove();
      A.toast?.('当前浏览器不支持流式写盘，已交给浏览器直接下载；此方式不记录断点。');
      await refreshTasks();
      return;
    }
    let handle;
    if (start > 0 && window.showOpenFilePicker) {
      A.toast?.(`该任务已下载 ${fmtBytes(start)}，请选择同一个本地文件继续写入。`);
      const picked = await window.showOpenFilePicker({ multiple: false });
      handle = picked[0];
      const existing = await handle.getFile();
      if (existing.size < start) throw new Error('所选文件长度小于已确认断点，无法安全续传');
    } else {
      handle = await window.showSaveFilePicker({ suggestedName: task.file_name });
    }
    const writable = await handle.createWritable({ keepExistingData: start > 0 });
    const controller = new AbortController();
    activeDownload = { taskId: task.id, abort: false };
    let offset = start;
    // A download delivers many small buffers per second; re-rendering the whole
    // task list on every one of them costs more than the write itself.
    let lastPaint = 0;
    const paint = force => {
      const now = Date.now();
      if (!force && now - lastPaint < 250) return;
      lastPaint = now;
      render();
    };
    noteProgress(task.id, offset, task.size);
    paint(true);
    try {
      const response = await fetch(`/api/v1/transfers/${task.id}/content`, {
        headers: auth({ Range: `bytes=${offset}-` }),
        signal: controller.signal,
      });
      if (!response.ok && response.status !== 206) throw new Error(`HTTP ${response.status}`);
      const reader = response.body.getReader();
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        if (activeDownload?.abort) { controller.abort(); throw new Error('已取消'); }
        await writable.write({ type: 'write', position: offset, data: value });
        offset += value.byteLength;
        noteProgress(task.id, offset, task.size);
        paint(false);
      }
      await writable.close();
      if (offset !== task.size) throw new Error(`下载长度 ${offset} 与远端大小 ${task.size} 不一致`);
      await api(`/api/v1/transfers/${task.id}/complete`, { method: 'POST' });
      A.toast?.(`下载完成：${task.file_name}`);
    } catch (error) {
      try { await writable.abort(); } catch {}
      A.toast?.('下载中断：' + error.message + '（任务保留，可续传）');
    } finally {
      progress.delete(task.id);
      activeDownload = null;
      await refreshTasks().catch(() => {});
    }
  }
})();
