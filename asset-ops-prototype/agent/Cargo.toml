[package]
name = "qiyun-agent"
version = "0.2.0"
edition = "2021"
description = "Linux / Proxmox VE / Docker / Kubernetes inventory agent for Qiyun Asset Ops"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env"] }
hostname = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
wait-timeout = "0.2"
toml = "0.8"
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"